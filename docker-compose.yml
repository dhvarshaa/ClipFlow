# Stage 1 topology: a web tier (gunicorn) + one or more render workers, sharing
# a data volume (SQLite job store + media). Scale workers with:
#   docker compose up --scale worker=3
services:
  web:
    build: .
    command: gunicorn -c gunicorn_conf.py app:app
    ports:
      - "5050:5050"
    environment:
      # Set a fixed key in production so download links stay valid across
      # restarts and are shared by web + worker. Falls back to a generated
      # key persisted in the shared volume if unset.
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      # Optional: set a password to protect a public trial (leave empty = open).
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    volumes:
      - appdata:/data
    restart: unless-stopped

  worker:
    build: .
    command: python worker.py
    environment:
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_DIR: /data
    volumes:
      - appdata:/data
    restart: unless-stopped

volumes:
  appdata:
